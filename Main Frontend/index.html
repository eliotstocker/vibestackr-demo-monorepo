<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>main-frontend</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body class="bg-gray-50 min-h-screen text-gray-900 font-sans antialiased">
    <header class="p-4 bg-white border-b border-gray-200 flex justify-end items-center shadow-sm">
      <div id="user-dropdown" class="relative inline-block text-left">
        <button type="button" class="inline-flex justify-center items-center rounded-lg border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-semibold text-gray-700 hover:bg-gray-50 transition-colors focus:outline-none ring-offset-2 focus:ring-2 focus:ring-blue-500" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
          <span class="mr-2">👤</span>
          <span id="user-name-text">Select User</span>
        </button>
        <div class="hidden origin-top-right absolute right-0 mt-2 w-56 rounded-xl shadow-2xl ring-1 ring-black ring-opacity-5 bg-white divide-y divide-gray-100 focus:outline-none z-50" id="user-dropdown-menu">
          <div class="py-1" role="none">
            <ul id="user-list" class="max-h-64 overflow-y-auto py-1 text-gray-900" role="list">
              <!-- Users will be populated here -->
            </ul>
          </div>
        </div>
      </div>
    </header>
    <main id="app" class="flex flex-col items-center justify-center p-6 mt-12">
      <div class="bg-white p-10 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] text-center max-w-md w-full border border-gray-100 transition-all hover:scale-[1.01]">
        <div id="status-badge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700 mb-6">
          <span class="w-2 h-2 mr-2 rounded-full bg-blue-500 animate-pulse"></span>
           Initializing...
        </div>
        <h1 id="message" class="text-4xl font-extrabold tracking-tight text-gray-900 mb-8 leading-tight">Connecting to server...</h1>
        
        <div id="counter-container" class="mb-8 p-8 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-3xl border border-blue-100 hidden transition-all duration-700 hover:shadow-lg group">
          <p class="text-[10px] uppercase tracking-[0.2em] text-blue-500 font-bold mb-3 opacity-80">Live Counter</p>
          <p id="counter-value" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 group-hover:scale-110 transition-transform duration-300">0</p>
        </div>

        <div class="pt-6 border-t border-gray-50">
          <p id="status" class="text-sm text-gray-400 font-medium"></p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
